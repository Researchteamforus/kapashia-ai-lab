name: Render Coordinator Smoke Test

on:
  push:
    branches:
      - chatgpt/render-smoke-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check coordinator and run harmless worker test
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sys
          import time
          import urllib.request
          import urllib.error

          BASE = "https://kapashia-ai-lab-3kct.onrender.com"

          def get_json(url, timeout=20):
              req = urllib.request.Request(url, headers={"User-Agent": "github-actions-render-smoke-test"})
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return json.loads(response.read().decode("utf-8"))

          def post_json(url, payload, timeout=20):
              body = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  url,
                  data=body,
                  method="POST",
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "github-actions-render-smoke-test",
                  },
              )
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return json.loads(response.read().decode("utf-8"))

          print(f"Coordinator: {BASE}")
          state = get_json(f"{BASE}/get_state")
          online_nodes = [n for n in state.get("nodes", []) if n.get("status") == "online"]
          print("Online nodes:", [n.get("node_id") for n in online_nodes])

          if not online_nodes:
              print("No online worker nodes. Coordinator is reachable, but execution cannot be tested now.")
              sys.exit(2)

          code = r'''
          import os
          import platform
          import multiprocessing
          print("GITHUB_RENDER_SMOKE_TEST_OK")
          print("Hostname:", platform.node())
          print("Platform:", platform.platform())
          print("CPU cores:", multiprocessing.cpu_count())
          print("PID:", os.getpid())
          '''

          dispatched = post_json(f"{BASE}/run_code", {"code": code, "targets": []})
          task_id = dispatched.get("task_id")
          print("Task ID:", task_id)
          if not task_id:
              print("Dispatch response did not contain task_id:", dispatched)
              sys.exit(3)

          deadline = time.time() + 75
          while time.time() < deadline:
              result = get_json(f"{BASE}/get_task_result/{task_id}")
              status = result.get("status")
              print("Task status:", status)
              if status == "completed":
                  responses = result.get("responses", {})
                  print("Worker responses:")
                  print(json.dumps(responses, indent=2, ensure_ascii=False))
                  if any("GITHUB_RENDER_SMOKE_TEST_OK" in (r.get("output") or "") for r in responses.values()):
                      print("Smoke test passed: GitHub -> Render coordinator -> worker -> result path is working.")
                      sys.exit(0)
                  print("Task completed, but expected smoke-test marker was not returned.")
                  sys.exit(4)
              if status == "overwritten":
                  print("Task was overwritten by another execution request.")
                  sys.exit(5)
              time.sleep(3)

          print("Timed out waiting for worker result.")
          sys.exit(6)
          PY
