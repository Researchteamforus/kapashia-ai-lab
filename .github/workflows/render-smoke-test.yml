name: Render Coordinator Smoke Test

on:
  push:
    branches:
      - chatgpt/render-smoke-test
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: chatgpt/render-smoke-test

      - name: Check coordinator and run harmless worker test
        shell: bash
        run: |
          python - <<'PY'
          import datetime
          import json
          import time
          import urllib.request

          BASE = "https://kapashia-ai-lab-3kct.onrender.com"
          report = {
              "checked_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "coordinator": BASE,
              "coordinator_reachable": False,
              "online_nodes": [],
              "task_id": None,
              "status": "not_started",
              "responses": {},
              "error": None,
          }

          def get_json(url, timeout=20):
              req = urllib.request.Request(url, headers={"User-Agent": "github-actions-render-smoke-test"})
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return json.loads(response.read().decode("utf-8"))

          def post_json(url, payload, timeout=20):
              body = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  url,
                  data=body,
                  method="POST",
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "github-actions-render-smoke-test",
                  },
              )
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return json.loads(response.read().decode("utf-8"))

          try:
              print(f"Coordinator: {BASE}")
              state = get_json(f"{BASE}/get_state")
              report["coordinator_reachable"] = True
              online_nodes = [n for n in state.get("nodes", []) if n.get("status") == "online"]
              report["online_nodes"] = [n.get("node_id") for n in online_nodes]
              print("Online nodes:", report["online_nodes"])

              if not online_nodes:
                  report["status"] = "coordinator_reachable_no_online_workers"
              else:
                  code = r'''
          import os
          import platform
          import multiprocessing
          print("GITHUB_RENDER_SMOKE_TEST_OK")
          print("Hostname:", platform.node())
          print("Platform:", platform.platform())
          print("CPU cores:", multiprocessing.cpu_count())
          print("PID:", os.getpid())
          '''
                  dispatched = post_json(f"{BASE}/run_code", {"code": code, "targets": []})
                  task_id = dispatched.get("task_id")
                  report["task_id"] = task_id
                  print("Task ID:", task_id)

                  if not task_id:
                      report["status"] = "dispatch_missing_task_id"
                  else:
                      deadline = time.time() + 75
                      while time.time() < deadline:
                          result = get_json(f"{BASE}/get_task_result/{task_id}")
                          status = result.get("status")
                          print("Task status:", status)
                          if status == "completed":
                              responses = result.get("responses", {})
                              report["responses"] = responses
                              marker_seen = any(
                                  "GITHUB_RENDER_SMOKE_TEST_OK" in (r.get("output") or "")
                                  for r in responses.values()
                              )
                              report["status"] = "passed" if marker_seen else "completed_without_marker"
                              break
                          if status == "overwritten":
                              report["status"] = "overwritten"
                              break
                          time.sleep(3)
                      else:
                          report["status"] = "timed_out_waiting_for_worker"

          except Exception as exc:
              report["status"] = "request_failed"
              report["error"] = f"{type(exc).__name__}: {exc}"
              print("Smoke test exception:", report["error"])

          with open("smoke-test-result.json", "w", encoding="utf-8") as f:
              json.dump(report, f, indent=2, ensure_ascii=False)
              f.write("\n")

          print(json.dumps(report, indent=2, ensure_ascii=False))
          PY

      - name: Commit smoke-test report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- smoke-test-result.json
          if ! git diff --cached --quiet; then
            git commit -m "Record Render smoke test result [skip ci]"
            git push origin HEAD:chatgpt/render-smoke-test
          fi

      - name: Evaluate smoke test
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sys
          with open("smoke-test-result.json", "r", encoding="utf-8") as f:
              report = json.load(f)
          print("Final smoke-test status:", report.get("status"))
          sys.exit(0 if report.get("status") == "passed" else 1)
          PY
