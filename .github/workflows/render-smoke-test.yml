name: Render Coordinator 2-Minute Stress Test

on:
  push:
    branches:
      - chatgpt/render-smoke-test
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stress-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: chatgpt/render-smoke-test

      - name: Dispatch 2-minute CPU stress test through Render coordinator
        shell: bash
        run: |
          python - <<'PY'
          import datetime
          import json
          import time
          import urllib.request

          BASE = "https://kapashia-ai-lab-3kct.onrender.com"
          TARGET = "Node2-GPU-T4-x2"
          report = {
              "checked_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "coordinator": BASE,
              "target_node": TARGET,
              "coordinator_reachable": False,
              "online_nodes": [],
              "task_id": None,
              "status": "not_started",
              "responses": {},
              "error": None,
          }

          def get_json(url, timeout=20):
              req = urllib.request.Request(url, headers={"User-Agent": "github-actions-render-stress-test"})
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return json.loads(response.read().decode("utf-8"))

          def post_json(url, payload, timeout=20):
              body = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  url,
                  data=body,
                  method="POST",
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "github-actions-render-stress-test",
                  },
              )
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return json.loads(response.read().decode("utf-8"))

          try:
              print(f"Coordinator: {BASE}")
              state = get_json(f"{BASE}/get_state")
              report["coordinator_reachable"] = True
              online_nodes = [n for n in state.get("nodes", []) if n.get("status") == "online"]
              report["online_nodes"] = [n.get("node_id") for n in online_nodes]
              print("Online nodes:", report["online_nodes"])

              if TARGET not in report["online_nodes"]:
                  report["status"] = "target_not_online"
              else:
                  code = r'''
          import multiprocessing
          import os
          import platform
          import time

          DURATION = 120

          def cpu_bound_task(args):
              worker_index, duration = args
              start = time.time()
              iterations = 0
              x = 1.000001
              while time.time() - start < duration:
                  for _ in range(200000):
                      x = (x * 1.0000001) / 1.0000001
                  iterations += 200000
              return {"worker": worker_index, "iterations": iterations, "elapsed": round(time.time() - start, 2)}

          cores = multiprocessing.cpu_count()
          print("GITHUB_RENDER_STRESS_TEST_STARTED")
          print("Hostname:", platform.node())
          print("Platform:", platform.platform())
          print("CPU cores detected:", cores)
          print("Stress duration seconds:", DURATION)
          print("Parent PID:", os.getpid())

          start_total = time.time()
          with multiprocessing.Pool(processes=cores) as pool:
              results = pool.map(cpu_bound_task, [(i + 1, DURATION) for i in range(cores)])
          elapsed = time.time() - start_total

          print("Per-process results:", results)
          print("Total active run time seconds:", round(elapsed, 2))
          print("GITHUB_RENDER_STRESS_TEST_OK")
          '''
                  dispatched = post_json(
                      f"{BASE}/run_code",
                      {"code": code, "targets": [TARGET]},
                  )
                  task_id = dispatched.get("task_id")
                  report["task_id"] = task_id
                  print("Task ID:", task_id)

                  if not task_id:
                      report["status"] = "dispatch_missing_task_id"
                  else:
                      deadline = time.time() + 200
                      while time.time() < deadline:
                          result = get_json(f"{BASE}/get_task_result/{task_id}")
                          status = result.get("status")
                          print("Task status:", status)
                          if status == "completed":
                              responses = result.get("responses", {})
                              report["responses"] = responses
                              marker_seen = any(
                                  "GITHUB_RENDER_STRESS_TEST_OK" in (r.get("output") or "")
                                  for r in responses.values()
                              )
                              report["status"] = "passed" if marker_seen else "completed_without_marker"
                              break
                          if status == "overwritten":
                              report["status"] = "overwritten"
                              break
                          time.sleep(4)
                      else:
                          report["status"] = "timed_out_waiting_for_worker"

          except Exception as exc:
              report["status"] = "request_failed"
              report["error"] = f"{type(exc).__name__}: {exc}"
              print("Stress test exception:", report["error"])

          with open("stress-test-result.json", "w", encoding="utf-8") as f:
              json.dump(report, f, indent=2, ensure_ascii=False)
              f.write("\n")

          print(json.dumps(report, indent=2, ensure_ascii=False))
          PY

      - name: Commit stress-test report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- stress-test-result.json
          if ! git diff --cached --quiet; then
            git commit -m "Record 2-minute stress test result [skip ci]"
            git push origin HEAD:chatgpt/render-smoke-test
          fi

      - name: Evaluate stress test
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sys
          with open("stress-test-result.json", "r", encoding="utf-8") as f:
              report = json.load(f)
          print("Final stress-test status:", report.get("status"))
          sys.exit(0 if report.get("status") == "passed" else 1)
          PY
