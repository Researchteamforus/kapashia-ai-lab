name: SRMA PubMed and Related Route

on:
  push:
    branches:
      - srma-final-api-rerun-20260901
    paths:
      - '.github/workflows/srma-pubmed-related.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run PubMed archival export and related-article route
        run: |
          python field_scope_qc/export_pubmed_related.py 2>&1 | tee pubmed_related_export.log
      - name: Create checksums
        if: always()
        run: |
          find pubmed_related_exports -type f -print0 2>/dev/null | sort -z | xargs -0 -r sha256sum > pubmed_related_sha256_manifest.txt
          cat pubmed_related_sha256_manifest.txt || true
      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: srma-pubmed-related-20260901
          retention-days: 30
          path: |
            pubmed_related_export.log
            pubmed_related_sha256_manifest.txt
            pubmed_related_exports/**
